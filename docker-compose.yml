version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: incidentflow-db
    environment:
      POSTGRES_USER: incidentflow
      POSTGRES_PASSWORD: incidentflow_dev
      POSTGRES_DB: incidentflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: incidentflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
